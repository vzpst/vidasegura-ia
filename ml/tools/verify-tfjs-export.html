<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VidaSegura IA | Verificação de exportação</title>
    <style>
        body { max-width: 760px; margin: 32px auto; padding: 0 18px; font: 16px/1.5 system-ui, sans-serif; color: #192331; }
        label { display: grid; gap: 6px; font-weight: 600; }
        input, button { min-height: 42px; padding: 8px 10px; border: 1px solid #9ba9b9; border-radius: 7px; font: inherit; }
        button { margin-top: 12px; cursor: pointer; }
        pre { overflow-wrap: anywhere; white-space: pre-wrap; background: #f1f5f9; padding: 14px; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Verificar modelo TensorFlow.js</h1>
    <p>Carrega um modelo local com <code>tf.loadLayersModel()</code> e executa uma entrada neutra de teste. Nenhum keypoint, vídeo ou imagem é enviado.</p>
    <label for="modelUrl">URL local de model.json
        <input id="modelUrl" type="url" required>
    </label>
    <button id="verify" type="button">Carregar e verificar</button>
    <pre id="result" role="status" aria-live="polite">Aguardando caminho do modelo.</pre>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script type="module" src="./verify-tfjs-export.js"></script>
</body>
</html>
